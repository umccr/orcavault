version: 2

sources:
  - name: tsa
    database: orcavault
    schema: tsa
    tables:
      - name: spreadsheet__library_tracking_metadata
      - name: spreadsheet__google_lims
      - name: spreadsheet__ica_usage_report
        columns:
          - name: id_matches_reference
            description: Lowercase Boolean text parsed from ICA usage metadata; null when no comparison is possible.
            data_tests:
              - accepted_values:
                  arguments:
                    values:
                      - "true"
                      - "false"
