version: 2

models:
  - name: lims
    description: Listing of the Centre genomic sequencing LIMS metadata in flat table model

  - name: fastq
    description: Listing of the Centre genomic sequencing unaligned read level file FASTQ S3 locations in flat table model

  - name: bam
    description: Listing of the Centre genomic sequencing aligned read level file BAM and BAI S3 locations in flat table model

  - name: vcf
    description: Listing of the Centre genomic sequencing variant call file VCF and TBI S3 locations in flat table model

  - name: workflow
    description: Listing of the Centre genomic sequencing analysis workflow run details in flat table model

  - name: workflow_output
    description: Listing of the Centre genomic sequencing analysis workflow run output location in flat table model

  - name: workflow_cost_report
    description: >
      Listing of the Centre genomic sequencing analysis workflow run ICA costs by ICA project in flat table model.
      Costs are reported in BIC; usage billed in iCredits before the 2026-05 BioInsight Core cutover is
      converted 1:1. Costs are net of any Illumina discount.
