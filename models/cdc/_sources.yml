version: 2

sources:
  - name: orcabus_sequence_run_manager
    database: awsdatacatalog
    schema: orcabus_sequence_run_manager
    tables:
      - name: sequence_run_manager_comment
        # This is the DMS source table a model depends on. It has a position in `ops.cdc_watermark` and
        # is tagged with the `cdc` tag which is required for updating positions.
        <<: &cdc_table
          config:
            tags: [cdc]
      - name: sequence_run_manager_libraryassociation
        <<: *cdc_table
      - name: sequence_run_manager_samplesheet
      - name: sequence_run_manager_sequence
        <<: *cdc_table
      - name: sequence_run_manager_state
        <<: *cdc_table

  - name: orcabus_workflow_manager
    database: awsdatacatalog
    schema: orcabus_workflow_manager
    tables:
      - name: workflow_manager_comment
        <<: *cdc_table
      - name: workflow_manager_library
        <<: *cdc_table
      - name: workflow_manager_libraryassociation
        <<: *cdc_table
      - name: workflow_manager_payload
      - name: workflow_manager_readset
      - name: workflow_manager_state
        <<: *cdc_table
      - name: workflow_manager_workflow
        <<: *cdc_table
      - name: workflow_manager_workflowrun
        <<: *cdc_table
      - name: workflow_manager_workflowrun_readsets

  - name: orcabus_metadata_manager
    database: awsdatacatalog
    schema: orcabus_metadata_manager
    tables:
      - name: app_contact
        <<: *cdc_table
      - name: app_historicalcontact
      - name: app_historicalindividual
      - name: app_historicallibrary
        <<: *cdc_table
      - name: app_historicallibraryprojectlink
      - name: app_historicalproject
      - name: app_historicalprojectcontactlink
      - name: app_historicalsample
        <<: *cdc_table
      - name: app_historicalsubject
        <<: *cdc_table
      - name: app_historicalsubjectindividuallink
      - name: app_individual
        <<: *cdc_table
      - name: app_library
        <<: *cdc_table
      - name: app_libraryprojectlink
        <<: *cdc_table
      - name: app_project
        <<: *cdc_table
      - name: app_projectcontactlink
        <<: *cdc_table
      - name: app_sample
        <<: *cdc_table
      - name: app_subject
        <<: *cdc_table
      - name: app_subjectindividuallink
        <<: *cdc_table

  - name: orcabus_filemanager
    database: awsdatacatalog
    schema: orcabus_filemanager
    tables:
      - name: s3_crawl
      - name: s3_object
        # The filemanager also has a partition expression, so it can't use the `cdc_table` anchor.
        config:
          tags: [cdc]
          meta:
            cdc_partition_expression: partition_0 || partition_1 || partition_2
