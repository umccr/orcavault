version: 2

# The CDC PSA relations have the same shape, so we define the requirements once and
# reuse them across all the relations.

models:
  - name: cdc_fm_s3_object
    <<: &psa_contract
      description: >-
        This is a read only PSA history for a OrcaBus DMS source table. It is the
        input from the upstream data source into the warehouse.
      data_tests:
        - cdc_file_identity
        - cdc_source_staged
      columns:
        - name: source_file_path
          description: >-
            The source file path from AWS DMS that contains the data. This is the
            path Spectrum uses to ingest rows, and it represent's the file's identity.
          data_tests:
            - not_null
        - name: source_partition_date
          description: >-
            The DMS date partition containing the source file. This can be null if 
            loading all objects.
          data_tests:
            - cdc_partition_date_valid
        - name: load_datetime
          description: This warehouse load time for the dbt run.
          data_tests:
            - not_null
        - name: record_source
          description: The OrcaBus DMS source table.
          data_tests:
            - not_null

  - name: cdc_mm_app_contact
    <<: *psa_contract

  - name: cdc_mm_app_historicallibrary
    <<: *psa_contract

  - name: cdc_mm_app_historicalsample
    <<: *psa_contract

  - name: cdc_mm_app_historicalsubject
    <<: *psa_contract

  - name: cdc_mm_app_individual
    <<: *psa_contract

  - name: cdc_mm_app_library
    <<: *psa_contract

  - name: cdc_mm_app_libraryprojectlink
    <<: *psa_contract

  - name: cdc_mm_app_project
    <<: *psa_contract

  - name: cdc_mm_app_projectcontactlink
    <<: *psa_contract

  - name: cdc_mm_app_sample
    <<: *psa_contract

  - name: cdc_mm_app_subject
    <<: *psa_contract

  - name: cdc_mm_app_subjectindividuallink
    <<: *psa_contract

  - name: cdc_srm_comment
    <<: *psa_contract

  - name: cdc_srm_libraryassociation
    <<: *psa_contract

  - name: cdc_srm_sequence
    <<: *psa_contract

  - name: cdc_srm_state
    <<: *psa_contract

  - name: cdc_wfm_comment
    <<: *psa_contract

  - name: cdc_wfm_library
