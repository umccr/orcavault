  - name: spreadsheet__ica_usage_report
    description: >
      Append-only history of the Illumina detailed usage report loaded from the transient spreadsheet report.
      Carries the union of the legacy ICA Usage Explorer layout (2026-04 and earlier) and the BioInsight Core
      Usage Explorer layout (2026-05 onwards) side by side, exactly as the source wrote them. A column the
      other layout does not carry is null. Units (iCredits, BIC) are not normalised here.
      Schema additions are applied in place with append_new_columns and --full-refresh is ignored, because the
      TSA snapshot is truncated on every load and this history cannot be rebuilt.
    columns:
      - name: usage_id
        data_type: varchar
      - name: usage_hash
        description: >
          SHA-256 hash derived from the independently hashed, cleaned usage ID and billing date. This is the
          append-only dedupe key and must never be redefined. row_seq is intentionally excluded; a row_seq > 1
          from the source collides here and fails the unique test, which is the intended alarm.
        data_type: char(64)
        data_tests:
          - not_null
          - unique
      - name: row_seq
        description: BioInsight Core only. Source row sequence within a usage_id, always 1 so far. Null for legacy rows.
        data_type: integer
      - name: uc_name
        data_type: varchar
      - name: billable_account_id
        data_type: varchar
      - name: account_name
        data_type: varchar
      - name: account_type
        data_type: varchar
      - name: usage_context
        data_type: varchar
      - name: usage_context_type
        data_type: varchar
      - name: user_name
        data_type: varchar
      - name: product
        data_type: varchar
      - name: usage_type_description
        data_type: varchar
      - name: quantity
        data_type: numeric(38,20)
      - name: usage_unit
        description: Stored as written. iCredits in the legacy layout, BIC from 2026-05 onwards (1:1 rename).
        data_type: varchar
      - name: pricing_method
        description: BioInsight Core only. Illumina documents this as Pricing Mechanism, always Standard Rate so far. Null for legacy rows.
        data_type: varchar
      - name: price_per_unit
        description: Legacy only. Superseded by list_rate in the BioInsight Core layout; identical values. Null from 2026-05 onwards.
        data_type: numeric(25,20)
      - name: list_rate
        description: BioInsight Core only. List rate per unit before discount. Null for legacy rows.
        data_type: numeric(25,20)
      - name: applied_rate
        description: BioInsight Core only. Rate per unit actually charged after discount; cost = quantity * applied_rate. Null for legacy rows.
        data_type: numeric(25,20)
      - name: cost
        data_type: numeric(25,20)
      - name: cost_saved
        description: BioInsight Core only. quantity * (list_rate - applied_rate). Null for legacy rows.
        data_type: numeric(25,20)
      - name: cost_unit
        description: Stored as written. iCredits in the legacy layout, BIC from 2026-05 onwards (1:1 rename).
        data_type: varchar
      - name: category
        data_type: varchar
      - name: usage_timestamp
        data_type: date
      - name: region
        data_type: varchar
      - name: metadata
        data_type: varchar
      - name: billing_date
        data_type: date
      - name: ica_execution_id
        data_type: varchar
      - name: license
        data_type: varchar
      - name: pipeline_uuid
        data_type: varchar
      - name: status
        data_type: varchar
      - name: domain
        data_type: varchar
      - name: type
        data_type: varchar
      - name: workflow_name
        data_type: varchar
      - name: workflow_version
        data_type: varchar
      - name: portal_run_id
        data_type: varchar
      - name: ref_format
        data_type: varchar
      - name: reference_raw
        data_type: varchar
      - name: ref_uuid
        data_type: varchar
      - name: id_matches_reference
        data_type: boolean
      - name: ica_v2
        description: BioInsight Core only. Parsed from storage row metadata from 2026-05 onwards. Null otherwise.
        data_type: boolean
      - name: is_in_grace_period
        description: BioInsight Core only. Parsed from storage row metadata from 2026-05 onwards; explains zero-cost storage rows. Null otherwise.
        data_type: boolean
      - name: load_datetime
        data_type: timestamptz
        data_tests:
          - not_null
      - name: record_source
        data_type: varchar(255)
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - spreadsheet__ica_usage_report
