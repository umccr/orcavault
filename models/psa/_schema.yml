        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - spreadsheet__ica_usage_report

  - name: redcap__case
    # History table: a request appends a new version whenever any column changes, so request_id repeats across
    # loads. Within one load the source holds one row per REDCap record, so a request_id appearing twice in the
    # same load_datetime means the snapshot was duplicated or the source key is no longer unique.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - request_id
              - load_datetime
    columns:
      - name: request_id
        data_type: varchar
        data_tests:
