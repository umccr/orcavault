  - name: spreadsheet__ica_usage_report
    description: >
      Append-only history of the Illumina detailed usage report loaded from the transient spreadsheet report.
      Carries the union of the legacy ICA Usage Explorer layout (2026-04 and earlier) and the BioInsight Core
      Usage Explorer layout (2026-05 onwards) side by side, exactly as the source wrote them. A column the
      other layout does not carry is null. Units (iCredits, BIC) are not normalised here.
      A column added to this model's SQL is applied to the live table in place with append_new_columns; a
      column added to TSA but not to this SQL is dropped silently, which the
      assert_ica_usage_tsa_columns_captured test warns about. A project-wide --full-refresh is ignored
      so this history is never discarded by accident; rebuild deliberately with the ica_usage_full_refresh var.
      A rebuild is lossless only while TSA still carries every source row, which holds today but stops holding
      once a source CSV is removed or Illumina restates a past month.
    # Guards the usage_hash definition itself. If the hash is redefined and the model then runs incrementally
    # instead of being rebuilt, every row re-appends under a new hash: unique(usage_hash) still passes, but
    # this natural key does not, so the double count fails here instead of reaching the mart.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - usage_id
              - row_seq
              - billing_date
    columns:
      - name: usage_id
        data_type: varchar
      - name: usage_hash
        description: >
          Billing-event key: SHA-256 of the cleaned usage_id, row_seq and billing_date. One usage event can split
          into several billing events, so row_seq is part of the grain. Rows are deduplicated on this hash alone,
          so redefining it requires rebuilding this model and the satellite.
        data_type: char(64)
        data_tests:
          - not_null
          - unique
      - name: row_seq
        description: >
          BioInsight Core only. Billing-event sequence within a usage event. Illumina splits one usage across rating
          mechanisms, e.g. row_seq 1 against a free allowance and row_seq 2 at standard rate for the remainder.
          Always 1 in reports so far. Null for legacy rows.
        data_type: integer
      - name: uc_name
        data_type: varchar
      - name: billable_account_id
        data_type: varchar
      - name: account_name
        data_type: varchar
      - name: account_type
        data_type: varchar
      - name: usage_context
        data_type: varchar
      - name: usage_context_type
        data_type: varchar
      - name: user_name
        data_type: varchar
      - name: product
        data_type: varchar
      - name: usage_type_description
        data_type: varchar
      - name: quantity
        data_type: numeric(38,20)
      - name: usage_unit
        description: Stored as written. iCredits in the legacy layout, BIC from 2026-05 onwards (1:1 rename).
        data_type: varchar
      - name: pricing_method
        description: BioInsight Core only. Pricing Mechanism for this billing event, expected to distinguish the rows of a split usage (e.g. allowance versus standard rate). Always Standard Rate so far. Null for legacy rows.
        data_type: varchar
      - name: price_per_unit
        description: Legacy only. Superseded by list_rate in the BioInsight Core layout; identical values. Null from 2026-05 onwards.
        data_type: numeric(25,20)
      - name: list_rate
        description: BioInsight Core only. List rate per unit before discount. Null for legacy rows.
        data_type: numeric(25,20)
      - name: applied_rate
        description: BioInsight Core only. Rate per unit actually charged after discount; cost = quantity * applied_rate. Null for legacy rows.
        data_type: numeric(25,20)
      - name: cost
        data_type: numeric(25,20)
      - name: cost_saved
        description: BioInsight Core only. quantity * (list_rate - applied_rate). Null for legacy rows.
        data_type: numeric(25,20)
      - name: cost_unit
        description: Stored as written. iCredits in the legacy layout, BIC from 2026-05 onwards (1:1 rename).
        data_type: varchar
      - name: category
        data_type: varchar
      - name: usage_timestamp
        data_type: date
      - name: region
        data_type: varchar
      - name: metadata
        data_type: varchar
      - name: billing_date
        data_type: date
      - name: ica_execution_id
        data_type: varchar
