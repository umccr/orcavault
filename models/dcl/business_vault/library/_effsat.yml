version: 2

models:

  - name: effsat_library_experiment
    config:
      contract: { enforced: true }
    constraints:
      - type: primary_key
        columns: [ library_experiment_hk, load_datetime ]
        warn_unenforced: false
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - library_experiment_hk
              - load_datetime
    columns:
      - name: library_experiment_hk
        data_type: char(64)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('link_library_experiment')
                field: library_experiment_hk
      - name: load_datetime
        data_type: timestamptz
        data_tests:
          - not_null
      - name: record_source
        data_type: varchar(100)
      - name: hash_diff
        data_type: char(64)
        data_tests:
          - not_null
      - name: library_id
        data_type: varchar(255)
      - name: experiment_id
        data_type: varchar(255)
      - name: effective_from
        data_type: timestamptz
      - name: effective_to
        data_type: timestamptz
      - name: is_current
        data_type: smallint

