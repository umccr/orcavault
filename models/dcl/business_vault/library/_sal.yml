version: 2

models:

  - name: sal_library
    config:
      contract: { enforced: true }
    constraints:
      - type: primary_key
        columns: [ sal_library_hk ]
        warn_unenforced: false
    columns:
      - name: sal_library_hk
        data_type: char(64)
        data_tests:
          - not_null
          - unique
      - name: base_library_hk
        data_type: char(64)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_library')
                field: library_hk
      - name: alias_library_hk
        data_type: char(64)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_library')
                field: library_hk
      - name: load_datetime
        data_type: timestamptz
        data_tests:
          - not_null
      - name: record_source
        data_type: varchar(100)
      - name: base_library_id
        data_type: varchar(255)
      - name: alias_library_id
        data_type: varchar(255)
