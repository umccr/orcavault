version: 2

models:

  - name: sat_workflow_run
    config:
      contract: { enforced: true }
    constraints:
      - type: primary_key
        columns: [ workflow_run_hk ]
        warn_unenforced: false
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - workflow_run_hk
    columns:
      - name: workflow_run_hk
        data_type: char(64)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_workflow_run')
                field: workflow_run_hk
      - name: load_datetime
        data_type: timestamptz
        data_tests:
          - not_null
      - name: record_source
        data_type: varchar(100)
      - name: hash_diff
        data_type: char(64)
        data_tests:
          - not_null
      - name: workflow_name
        data_type: varchar(255)
      - name: workflow_version
        data_type: varchar(100)
      - name: workflow_code_version
        data_type: varchar(100)
      - name: workflow_validation_state
        data_type: varchar(100)
      - name: workflow_run_status
        data_type: varchar(255)
      - name: workflow_run_start
        data_type: timestamptz
      - name: workflow_run_end
        data_type: timestamptz
      - name: workflow_run_comment
        data_type: varchar(65535)
      - name: is_deleted
        data_type: smallint

  - name: sat_workflow_run_ica_usage
    config:
      contract: { enforced: true }
    constraints:
      - type: primary_key
        columns: [ workflow_run_hk, usage_hash ]
        warn_unenforced: false
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - workflow_run_hk
              - usage_hash
    columns:
      - name: workflow_run_hk
        data_type: char(64)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_workflow_run')
                field: workflow_run_hk
      - name: load_datetime
        data_type: timestamptz
        data_tests:
          - not_null
      - name: record_source
        data_type: varchar(100)
        data_tests:
          - not_null
      - name: hash_diff
        data_type: char(64)
        data_tests:
          - not_null
      - name: usage_id
        data_type: varchar(255)
      - name: usage_hash
        data_type: char(64)
        data_tests:
          - not_null
          - unique
      - name: usage_context
        data_type: varchar(255)
      - name: usage_context_type
        data_type: varchar(255)
      - name: user_name
        data_type: varchar(255)
      - name: product
        data_type: varchar(255)
      - name: usage_type_description
        data_type: varchar(255)
      - name: usage_quantity
        data_type: numeric(38,20)
      - name: usage_unit
        data_type: varchar(255)
      - name: price_per_unit
        data_type: numeric(25,20)
      - name: cost
        data_type: numeric(25,20)
      - name: cost_unit
        data_type: varchar(255)
      - name: category
        data_type: varchar(255)
      - name: usage_timestamp
        data_type: date
      - name: region
        data_type: varchar(255)
      - name: ica_execution_id
        data_type: varchar(255)
      - name: is_license_cost
        data_type: boolean
      - name: id_matches_reference
        data_type: boolean
      - name: billing_date
        data_type: date
