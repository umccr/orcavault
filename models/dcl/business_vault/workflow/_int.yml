# See the intermediate model guide at models/dcl/business_vault/s3object/_int.yml

version: 2

models:

  - name: int_workflow_run_ica_usage
    description: >
      Intermediate table that reconciles the two Illumina usage export layouts carried by
      sat_workflow_run_ica_usage into one comparable grain, one row per usage line resolved to an ICA
      workflow run. The unit the source wrote is kept (source_cost_unit, source_usage_unit) and the reported
      unit and amounts are derived from it through the mdm__ica_billing_unit seed, with the rate used recorded
      on the row; today that is iCredits to BIC at 1:1. The legacy price_per_unit stands in for both
      list_rate and applied_rate, and cost_saved is 0 where the source predates the discount. Rebuilt on every
      run so business rules can change without touching the append-only PSA and satellite. Mart cost reports
      must read this model, not the satellite, so one workflow run never splits across two units.
    config:
      contract: { enforced: true }
    constraints:
      - type: primary_key
        columns: [ workflow_run_hk, usage_hash ]
        warn_unenforced: false
    columns:
      - name: workflow_run_hk
        data_type: char(64)
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('hub_workflow_run')
                field: workflow_run_hk
      - name: usage_hash
        data_type: char(64)
        data_tests:
          - not_null
          - unique
      - name: usage_id
        data_type: varchar(255)
      - name: row_seq
        description: Source row sequence, BioInsight Core only. Null for legacy rows.
        data_type: integer
      - name: source_layout
        description: >
          Which export layout the row came from, derived the same way the Glue job labels files:
          bioinsight when a BioInsight-only column is present, legacy when price_per_unit is present.
        data_type: varchar(20)
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - legacy
                  - bioinsight
      - name: usage_context
        data_type: varchar(255)
      - name: usage_context_type
        data_type: varchar(255)
      - name: user_name
        data_type: varchar(255)
      - name: product
        data_type: varchar(255)
      - name: usage_type_description
        data_type: varchar(255)
      - name: category
        data_type: varchar(255)
      - name: region
        data_type: varchar(255)
      - name: usage_timestamp
        data_type: date
      - name: billing_date
        data_type: date
      - name: ica_execution_id
        data_type: varchar(255)
      - name: is_license_cost
        data_type: boolean
      - name: id_matches_reference
        data_type: boolean
      - name: ica_v2
        data_type: boolean
      - name: is_in_grace_period
        data_type: boolean
      - name: pricing_method
        description: As reported by BioInsight Core. Null for legacy rows, which predate the field.
        data_type: varchar(255)
      - name: source_usage_unit
        description: Usage unit exactly as the source wrote it (TB-Months, iCredits, BIC, ...).
        data_type: varchar(255)
      - name: usage_unit
        description: Reported usage unit. source_usage_unit mapped through mdm__ica_billing_unit, or unchanged when unmapped.
        data_type: varchar(255)
      - name: usage_conversion_rate
        description: Rate applied to usage_quantity, from mdm__ica_billing_unit. Null when source_usage_unit is not a billing unit or is unmapped, in which case the quantity is passed through.
        data_type: numeric(9,6)
      - name: usage_quantity
        description: Quantity in usage_unit.
        data_type: numeric(38,20)
      - name: source_cost_unit
        description: Cost unit exactly as the source wrote it. iCredits before the 2026-05 cutover, BIC after.
        data_type: varchar(255)
      - name: cost_unit
        description: >
          Reported cost unit. source_cost_unit mapped through mdm__ica_billing_unit, or unchanged when unmapped.
          Any value other than BIC is a unit the seed does not know and warns here so the mart grain change is
          noticed and a seed row can be added.
        data_type: varchar(255)
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - BIC
              config:
                severity: warn
      - name: cost_conversion_rate
        description: Rate applied to cost, cost_saved, list_rate and applied_rate, from mdm__ica_billing_unit. Null when source_cost_unit is unmapped, in which case the amounts are passed through.
        data_type: numeric(9,6)
      - name: list_rate
        description: Rate per usage unit before discount, in cost_unit. BioInsight Core list_rate, or the legacy price_per_unit.
        data_type: numeric(25,20)
      - name: applied_rate
        description: Rate per usage unit actually charged, in cost_unit. BioInsight Core applied_rate, or the legacy price_per_unit since no discount applied then.
        data_type: numeric(25,20)
      - name: cost
        description: Amount charged, in cost_unit.
        data_type: numeric(25,20)
      - name: cost_saved
        description: Discount applied, usage_quantity * (list_rate - applied_rate), in cost_unit. 0 for legacy rows.
        data_type: numeric(25,20)
