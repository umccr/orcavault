repos:

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^(yarn.lock|.yarn/)
      - id: check-json
      - id: check-yaml
      - id: detect-aws-credentials
        args: [ --allow-missing-credentials ]
      - id: detect-private-key
#      - id: end-of-file-fixer
#      - id: trailing-whitespace
      - id: no-commit-to-branch
        args: [ --branch, main, --branch, master, --pattern, release/.* ]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: detect secrets
        args: [ '--baseline', '.secrets.baseline' ]
        exclude: ^(.venv/|.local/|.terraform/|terraform.tfstate.d/|dbt_packages/|logs/)|package-lock.yml|pnpm-lock.yaml

  - repo: local
    hooks:
      - id: readme-line-cap
        name: README.md stays a landing page (max 60 lines)
        language: system
        files: ^README\.md$
        pass_filenames: false
        entry: >-
          bash -c 'n=$(wc -l < README.md);
          [ "$n" -le 60 ] || { echo "README.md has $((n)) lines (max 60). Put new content in docs/dev/<topic>.md and index it in docs/README.md."; exit 1; }'
